name: ci

# The repo's own check chain: Cocos TS types, core rule tests, level validation,
# and Cocos project static validation.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check + core + levels + Cocos project validation
        run: |
          npm run check:cocos
          npm run test:levels
          npm run test:core
          npm run test:project
