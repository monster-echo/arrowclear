name: submit-review

# Sends the staged store releases for human review via pure API.
# Platform rules for FIRST launches:
#   - Google Play: a never-published (draft) app must be sent once from
#     Play Console → 发布概览 → 将应用送审. Works from the 2nd release on.
#   - App Store: a version rejected once then edited must be resubmitted from
#     the ASC web button once. Works for every fresh version.

on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to submit
        type: choice
        options: [all, google, apple]
        default: all

permissions:
  contents: read

concurrency:
  group: submit-review
  cancel-in-progress: false

jobs:
  google:
    if: inputs.store == 'all' || inputs.store == 'google'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit Play production release for review
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages 'PyJWT[crypto]' \
            || python3 -m pip install --quiet 'PyJWT[crypto]'
          python3 tools/play_submit_review.py --package tech.zhongbei.arrowclear

  apple:
    if: inputs.store == 'all' || inputs.store == 'apple'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit App Store version for review
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages 'PyJWT[crypto]' \
            || python3 -m pip install --quiet 'PyJWT[crypto]'
          eval "$(python3 tools/set_versions.py get)"
          python3 tools/asc_submit_review.py --bundle tech.zhongbei.arrowclear --version "$version"
