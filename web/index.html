<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#F5F6FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>一箭清空 · Arrow Clear</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>

      <header id="hud" class="hud is-hidden">
        <div class="hud-row">
          <button class="icon-btn" id="btn-pause" aria-label="暂停">
            <span data-icon="pause"></span>
          </button>
          <div class="hud-center">
            <div class="level-title" id="hud-level">第 1 关</div>
            <div class="hud-sub">
              <div class="hearts" id="hud-hearts"></div>
              <div class="timer" id="hud-timer">
                <span data-icon="clock"></span><b>02:00</b>
              </div>
            </div>
          </div>
        </div>
        <div class="progress"><i id="hud-progress"></i></div>
      </header>
      <div id="debug-panel" class="debug-panel is-hidden">
        <button id="debug-close" class="debug-close" aria-label="关闭调试">×</button>
        <div class="debug-title">DEBUG · 关卡质量</div>
        <div class="debug-row"><span>链接深度</span><b id="dbg-depth">--</b></div>
        <div class="debug-row"><span>棋盘评分</span><b id="dbg-score">--</b></div>
        <div class="debug-row"><span>可释放</span><b id="dbg-free">--</b></div>
        <div class="debug-row"><span>推进</span><b id="dbg-progress">--</b></div>
        <div class="debug-row"><span>箭头 / 填充</span><b id="dbg-arrows">--</b></div>
        <div id="dbg-formula" class="debug-formula">--</div>
        <div class="debug-actions">
          <button id="dbg-autosolve" class="debug-btn">▶ 自动解密</button>
          <button id="dbg-xray" class="debug-btn" title="X-Ray 精妙透视（快捷键 X）">✨ 透视</button>
          <button id="dbg-newsolve" class="debug-btn" title="重新解一遍">↻ 重置</button>
        </div>
        <div class="debug-actions" style="flex-direction: column; gap: 3px;">
          <div style="color:#9fb2c8">①→⑥ 蓝弧=跃迁链 · 橙框=连环扣</div>
          <div style="color:#9fb2c8">金脊=击尾导流 · 绿虚线=穿针窄门</div>
        </div>
      </div>

      <footer id="toolbar" class="toolbar is-hidden">
        <button class="tool tool-compact" id="btn-hint" aria-label="提示">
          <span class="tool-ico" data-icon="bulb"></span>
          <span class="tool-label">提示</span>
          <span class="tool-badge" id="hint-cost">3</span>
        </button>
        <div class="zoom-wrap">
          <button class="zoom-btn" id="btn-zoom-out" aria-label="缩小">
            <span data-icon="zoomOut"></span>
          </button>
          <input id="zoom-range" type="range" min="65" max="220" step="1" value="100" aria-label="缩放" />
          <button class="zoom-btn" id="btn-zoom-in" aria-label="放大">
            <span data-icon="zoomIn"></span>
          </button>
          <span class="zoom-label" id="zoom-label">100%</span>
        </div>
        <button class="tool tool-compact" id="btn-restart" aria-label="重来">
          <span class="tool-ico" data-icon="restart"></span>
          <span class="tool-label">重来</span>
        </button>
      </footer>

      <section id="home" class="screen home">
        <div class="top-row">
          <button class="icon-btn glass" id="btn-home-settings" aria-label="设置">
            <span data-icon="gear"></span>
          </button>
          <button class="energy-pill" id="btn-energy" aria-label="体力">
            <span data-icon="bolt"></span>
            <b id="energy-count">5/5</b>
            <span class="energy-next" id="energy-next"></span>
          </button>
        </div>

        <div class="brand">
          <div class="logo" id="logo" role="img" aria-label="一箭清空"></div>
          <div class="logo-sub">ARROW&nbsp;CLEAR</div>
        </div>

        <div class="mascot" id="mascot" aria-hidden="true"></div>

        <div class="play-wrap">
          <div class="level-chip" id="home-level-chip">第 1 关</div>
          <button class="btn btn-play" id="btn-play">
            <span class="play-tri" data-icon="play"></span>
            <span>开始游戏</span>
          </button>
          <div class="home-hint" id="home-hint">点击箭头发射，清空整幅图案</div>
        </div>

        <nav class="home-nav">
          <button class="nav-btn" id="btn-nav-levels">
            <span class="nav-ico" data-icon="levels"></span><span>关卡</span>
          </button>
          <button class="nav-btn" id="btn-nav-howto">
            <span class="nav-ico" data-icon="help"></span><span>玩法</span>
          </button>
        </nav>

        <div class="version">v0.1.0 · made with Cocos Creator</div>
      </section>

      <section id="levels" class="screen levels is-hidden">
        <div class="sheet-head">
          <button class="icon-btn glass" id="btn-levels-back" aria-label="返回">
            <span data-icon="back"></span>
          </button>
          <h2>选择关卡</h2>
          <div class="star-total"><span data-icon="star"></span><b id="total-stars">0</b></div>
        </div>
        <div class="level-grid" id="level-grid"></div>
      </section>

      <div id="overlay" class="overlay is-hidden"></div>
      <div id="toast" class="toast"></div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
